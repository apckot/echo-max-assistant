[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Only the fixed synthetic privacy-refusal fixture; never an issued credential"
condition = "AND"
paths = ['''(?:^|/)tests/functional/privacy/egress-contract\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^api_key=synthetic-forbidden$''']
