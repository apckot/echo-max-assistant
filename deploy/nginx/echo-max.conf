# Include in a TLS server with operator-provisioned certificate/server_name.
# Credentials and /ops are never exposed through the public proxy.
client_max_body_size 1m;
location = /webhooks/max {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8080;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
location = /health/live { proxy_pass http://127.0.0.1:8080; }
location / { return 404; }
